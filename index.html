<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/svg+xml" href="./clair-mark.svg">
    <title>Clair IA</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #000;
        color: #fff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: #000;
      }

      main {
        width: min(100%, 900px);
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 48px;
        color: #fff;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .brand img {
        width: 40px;
        height: 40px;
      }

      .brand-dot {
        color: #168bff;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #999;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 4.5rem);
        font-weight: 500;
        letter-spacing: -0.06em;
        line-height: 1.05;
      }

      .target-date {
        margin: 18px 0 56px;
        color: #888;
        font-size: clamp(0.95rem, 2vw, 1.1rem);
      }

      .countdown {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(12px, 4vw, 40px);
        border: 1px solid #168bff;
        border-radius: 12px;
        padding: clamp(20px, 5vw, 40px);
      }

      .unit {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .value {
        font-variant-numeric: tabular-nums;
        font-size: clamp(2.5rem, 12vw, 7rem);
        font-weight: 300;
        letter-spacing: -0.07em;
        line-height: 1;
      }

      .label {
        color: #777;
        font-size: clamp(0.65rem, 1.7vw, 0.8rem);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      @media (max-width: 480px) {
        .brand {
          margin-bottom: 36px;
        }

        .target-date {
          margin-bottom: 44px;
        }

        .countdown {
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="./clair-mark.svg" alt="">
        <span>Clair<span class="brand-dot">.</span></span>
      </div>
      <p class="eyebrow">Le compte à rebours est lancé</p>
      <h1>À dimanche prochain</h1>
      <p class="target-date" id="target-date"></p>

      <section class="countdown" aria-label="Temps restant">
        <div class="unit">
          <span class="value" id="days">00</span>
          <span class="label">Jours</span>
        </div>
        <div class="unit">
          <span class="value" id="hours">00</span>
          <span class="label">Heures</span>
        </div>
        <div class="unit">
          <span class="value" id="minutes">00</span>
          <span class="label">Minutes</span>
        </div>
        <div class="unit">
          <span class="value" id="seconds">00</span>
          <span class="label">Secondes</span>
        </div>
      </section>
    </main>

    <script>
      const now = new Date();
      const daysUntilSunday = (7 - now.getDay()) % 7 || 7;
      const target = new Date(now);
      target.setDate(now.getDate() + daysUntilSunday);
      target.setHours(10, 0, 0, 0);

      document.getElementById("target-date").textContent =
        target.toLocaleDateString("fr-FR", {
          weekday: "long",
          day: "numeric",
          month: "long",
        }) + " à 10 h";

      const units = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds"),
      };

      function updateCountdown() {
        const remainingSeconds = Math.max(0, Math.floor((target - new Date()) / 1000));
        units.days.textContent = String(Math.floor(remainingSeconds / 86400)).padStart(2, "0");
        units.hours.textContent = String(Math.floor((remainingSeconds % 86400) / 3600)).padStart(2, "0");
        units.minutes.textContent = String(Math.floor((remainingSeconds % 3600) / 60)).padStart(2, "0");
        units.seconds.textContent = String(remainingSeconds % 60).padStart(2, "0");
      }

      updateCountdown();
      window.setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
